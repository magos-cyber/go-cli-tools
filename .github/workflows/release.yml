name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.19', '1.20', '1.21']
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      
      - name: Build all tools
        run: make build
      
      - name: Run vet
        run: go vet ./...
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}-go${{ matrix.go-version }}
          path: bin/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      
      - name: Build release binaries
        run: |
          mkdir -p release
          for tool in proxmox-cli docker-compose net-diag k8s-deploy helm-cli vault-cli consul-cli; do
            GOOS=linux GOARCH=amd64 go build -o release/${tool}-linux-amd64 ./cmd/${tool}/
            GOOS=linux GOARCH=arm64 go build -o release/${tool}-linux-arm64 ./cmd/${tool}/
            GOOS=darwin GOARCH=amd64 go build -o release/${tool}-darwin-amd64 ./cmd/${tool}/
            GOOS=darwin GOARCH=arm64 go build -o release/${tool}-darwin-arm64 ./cmd/${tool}/
            GOOS=windows GOARCH=amd64 go build -o release/${tool}-windows-amd64.exe ./cmd/${tool}/
          done
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*
          generate_release_notes: true